spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/repopulse
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

# ── JWT Configuration ─────────────────────────────────────────────────────────
application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000        # 1 day in ms
      refresh-token:
        expiration: 604800000     # 7 days in ms

# ── GitHub API ────────────────────────────────────────────────────────────────
github:
  # Set via env var: GITHUB_TOKEN=ghp_xxx   or set directly here (never commit real tokens)
  token: ${GITHUB_TOKEN:}
  api:
    max-pages: 10    # maximum pages to fetch per paginated endpoint

# ── ML Service (FastAPI) ──────────────────────────────────────────────────────
ml:
  service:
    url: http://localhost:8001   # FastAPI prediction service base URL

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.repopulse: DEBUG
    org.hibernate.SQL: DEBUG
