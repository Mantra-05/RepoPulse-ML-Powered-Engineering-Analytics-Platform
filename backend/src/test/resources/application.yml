spring:
  datasource:
    url: jdbc:h2:mem:repopulse_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

application:
  security:
    jwt:
      # 256-bit Base64 key (same as dev — safe for tests, never use in prod as-is)
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000           # 1 day in ms
      refresh-token:
        expiration: 604800000        # 7 days in ms

logging:
  level:
    com.repopulse: WARN
    org.hibernate.SQL: WARN
